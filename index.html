<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafePath - Defect Detection</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    /* Header */
    .header {
      background-color: #111;
      padding: 12px 20px;
      border-bottom: 1px solid #333;
    }
    .header h1 {
      margin: 0;
      font-size: 18px;
    }
    .header span {
      color: #888;
      font-size: 12px;
    }

    /* API bar */
    .api-bar {
      background-color: #111;
      padding: 10px 20px;
      border-bottom: 1px solid #333;
    }
    .api-bar label {
      color: #888;
      font-size: 12px;
      margin-right: 8px;
    }
    .api-bar input {
      background-color: #222;
      color: #fff;
      border: 1px solid #444;
      padding: 6px 10px;
      font-size: 13px;
      width: 300px;
      border-radius: 4px;
    }

    /* Buttons area */
    .buttons {
      padding: 16px 20px;
      text-align: center;
      border-bottom: 1px solid #333;
    }
    .btn {
      padding: 10px 28px;
      margin: 4px 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      border: none;
    }
    .btn-upload {
      background-color: #fff;
      color: #000;
    }
    .btn-upload:hover {
      background-color: #ddd;
    }
    .btn-live {
      background-color: transparent;
      color: #fff;
      border: 1px solid #555;
    }
    .btn-live:hover {
      background-color: #222;
    }
    .btn-stop {
      background-color: transparent;
      color: #aaa;
      border: 1px solid #555;
    }

    /* Status text */
    .status-bar {
      padding: 8px 20px;
      color: #666;
      font-size: 12px;
      border-bottom: 1px solid #222;
    }

    /* Content area - two columns */
    .content {
      width: 100%;
      overflow: hidden;
    }
    .left-col {
      float: left;
      width: 50%;
      border-right: 1px solid #222;
      min-height: 400px;
    }
    .right-col {
      float: left;
      width: 49%;
      min-height: 400px;
    }

    /* Panel */
    .panel-title {
      padding: 8px 16px;
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #222;
    }
    .panel-content {
      padding: 16px;
      text-align: center;
    }
    .panel-content img {
      max-width: 100%;
      max-height: 350px;
    }
    .panel-content video {
      max-width: 100%;
      max-height: 350px;
    }

    /* Placeholder text */
    .placeholder {
      color: #444;
      padding: 80px 20px;
      font-size: 13px;
    }

    /* Results */
    .result-box {
      border: 1px solid #333;
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .result-box.pass {
      border-color: #555;
    }
    .result-box.fail {
      border-color: #777;
    }
    .result-label {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .result-detail {
      font-size: 12px;
      color: #888;
    }

    .counts-row {
      overflow: hidden;
      margin-bottom: 10px;
    }
    .count-box {
      float: left;
      width: 48%;
      margin-right: 2%;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px;
    }
    .count-box-label {
      font-size: 10px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .count-box-value {
      font-size: 20px;
      font-weight: bold;
    }

    .defect-row {
      border: 1px solid #333;
      border-radius: 4px;
      padding: 8px 12px;
      margin-bottom: 4px;
      font-size: 13px;
      overflow: hidden;
    }
    .defect-conf {
      float: right;
      color: #888;
      font-size: 12px;
    }

    .section-label {
      font-size: 10px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      margin-top: 10px;
    }

    /* Info rows for static result */
    .info-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 10px;
    }
    .info-table td {
      padding: 6px 8px;
      border-bottom: 1px solid #222;
      font-size: 13px;
    }
    .info-table td:first-child {
      color: #666;
      width: 40%;
    }
    .info-table td:last-child {
      color: #fff;
      font-weight: bold;
    }

    /* Hidden file input */
    #file-input {
      display: none;
    }

    /* Toggle switch */
    .toggle-wrap {
      display: inline-block;
      vertical-align: middle;
      margin: 0 12px;
    }
    .toggle-label {
      font-size: 12px;
      color: #888;
      vertical-align: middle;
      margin: 0 6px;
    }
    .toggle-label.active {
      color: #fff;
      font-weight: bold;
    }
    .toggle-switch {
      display: inline-block;
      vertical-align: middle;
      width: 44px;
      height: 22px;
      background-color: #333;
      border-radius: 11px;
      cursor: pointer;
      position: relative;
      border: 1px solid #555;
    }
    .toggle-knob {
      width: 18px;
      height: 18px;
      background-color: #fff;
      border-radius: 50%;
      position: absolute;
      top: 1px;
      left: 2px;
    }
    .toggle-switch.on .toggle-knob {
      left: 23px;
    }

    /* Manual buttons */
    .manual-buttons {
      margin-top: 12px;
      text-align: center;
    }
    .btn-pass {
      padding: 10px 32px;
      margin: 4px 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      border: 1px solid #555;
      background-color: #111;
      color: #fff;
    }
    .btn-pass:hover {
      background-color: #222;
      border-color: #888;
    }
    .btn-reject {
      padding: 10px 32px;
      margin: 4px 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      border: 1px solid #555;
      background-color: #111;
      color: #fff;
    }
    .btn-reject:hover {
      background-color: #222;
      border-color: #888;
    }

    /* Clear floats */
    .clearfix::after {
      content: "";
      display: table;
      clear: both;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1>SafePath</h1>
    <span id="status-text">Idle</span>
  </div>

  <!-- API URL -->
  <div class="api-bar">
    <label>API URL:</label>
    <input type="text" id="api-url" value="http://127.0.0.1:8000" placeholder="http://your-server:port">
  </div>

  <!-- Buttons -->
  <div class="buttons">
    <input type="file" id="file-input" accept="image/*">
    <button class="btn btn-upload" onclick="document.getElementById('file-input').click()">Upload Image</button>
    <button class="btn btn-live" id="btn-live" onclick="toggleLive()">Start Live</button>

    <!-- Mode toggle -->
    <span class="toggle-wrap">
      <span class="toggle-label active" id="label-auto">Auto</span>
      <span class="toggle-switch" id="mode-toggle" onclick="toggleMode()">
        <span class="toggle-knob"></span>
      </span>
      <span class="toggle-label" id="label-manual">Manual</span>
    </span>
  </div>

  <!-- Status -->
  <div class="status-bar" id="status-bar"></div>

  <!-- Two columns: Input and Results -->
  <div class="content clearfix">

    <!-- Left: Input image -->
    <div class="left-col">
      <div class="panel-title">Input</div>
      <div class="panel-content" id="input-area">
        <div class="placeholder" id="input-placeholder">Upload an image or start live camera</div>
        <img id="input-img" alt="Input" style="display:none;">
        <video id="input-video" autoplay muted playsinline style="display:none;"></video>
      </div>
    </div>

    <!-- Right: Results -->
    <div class="right-col">
      <div class="panel-title">Results</div>
      <div class="panel-content" id="results-area" style="text-align:left;">

        <div class="placeholder" id="idle-msg" style="display:none;">No results yet</div>

        <!-- Verdict -->
        <div class="result-box" id="verdict-box" style="display:none;">
          <div class="result-label" id="verdict-label">—</div>
          <div class="result-detail" id="verdict-detail"></div>
        </div>

        <!-- Info table -->
        <div id="info-section">
          <table class="info-table" id="info-table">
            <tr><td>Material</td><td id="info-material">—</td></tr>
            <tr><td>Defect Type</td><td id="info-defect-type">—</td></tr>
            <tr><td>Severity</td><td id="info-severity">—</td></tr>
            <tr><td>Defect Count</td><td id="info-count">—</td></tr>
            <tr><td>Bent</td><td id="info-bent">—</td></tr>
          </table>
        </div>

        <!-- Defect list -->
        <div id="defect-section" style="display:none;">
          <div class="section-label">Detected Classes</div>
          <div id="defect-list"></div>
        </div>

        <!-- Manual mode: Pass / Reject buttons -->
        <div class="manual-buttons" id="manual-buttons">
          <p style="color:#888; font-size:12px; margin-bottom:10px;">Your call — pass or reject this?</p>
          <button class="btn-pass" onclick="manualDecision('PASS')">✅ Pass</button>
          <button class="btn-reject" onclick="manualDecision('FAIL')">❌ Reject</button>
        </div>

      </div>
    </div>

  </div>

<script>
// ─── State ───────────────────────────────
var liveMode = false;
var liveStream = null;
var ws = null;
var webcamPollTimer = null;
var isManualMode = false;
var lastResult = null;  // holds API result in manual mode

// Get the API URL from the input field
function getAPI() {
  return document.getElementById('api-url').value.replace(/\/+$/, '');
}

// ─── File Upload ─────────────────────────
document.getElementById('file-input').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  if (liveMode) stopLive();
  runInference(file);
  e.target.value = '';
});

// ─── Run Inference on an Image ───────────
function runInference(file) {
  setStatus('Processing...');

  // Show the uploaded image
  var url = URL.createObjectURL(file);
  showInputImage(url);

  // Send to API
  var fd = new FormData();
  fd.append('image', file);

  fetch(getAPI() + '/detect', {
    method: 'POST',
    body: fd
  })
  .then(function(res) {
    if (res.ok) return res.json();
    throw new Error('API error');
  })
  .then(function(result) {
    showResult(result);
    setStatus('Done');
  })
  .catch(function() {
    setStatus('API not connected');
  });
}

// ─── Live Mode ───────────────────────────
function toggleLive() {
  if (liveMode) {
    stopLive();
    return;
  }

  // Try API first, fallback to webcam
  fetch(getAPI() + '/health', { signal: AbortSignal.timeout(1500) })
    .then(function(r) {
      if (r.ok) {
        startAPILive();
      } else {
        startWebcamLive();
      }
    })
    .catch(function() {
      startWebcamLive();
    });
}

function startAPILive() {
  liveMode = true;
  setStatus('Live (API stream)');

  var img = document.getElementById('input-img');
  img.src = getAPI() + '/video_feed?t=' + Date.now();
  img.style.display = 'block';
  document.getElementById('input-placeholder').style.display = 'none';
  document.getElementById('input-video').style.display = 'none';

  connectWS();

  document.getElementById('btn-live').textContent = 'Stop';
  document.getElementById('btn-live').className = 'btn btn-stop';
}

function startWebcamLive() {
  navigator.mediaDevices.getUserMedia({ video: true, audio: false })
    .then(function(stream) {
      liveStream = stream;
      liveMode = true;
      setStatus('Live (webcam)');

      var video = document.getElementById('input-video');
      video.srcObject = stream;
      video.style.display = 'block';
      document.getElementById('input-placeholder').style.display = 'none';
      document.getElementById('input-img').style.display = 'none';

      document.getElementById('btn-live').textContent = 'Stop';
      document.getElementById('btn-live').className = 'btn btn-stop';

      pollWebcam();
    })
    .catch(function() {
      setStatus('Camera access denied');
    });
}

function pollWebcam() {
  var canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d');

  function poll() {
    if (!liveMode) return;
    var vid = document.getElementById('input-video');
    if (vid.readyState < 2) {
      webcamPollTimer = setTimeout(poll, 500);
      return;
    }

    canvas.width = vid.videoWidth || 640;
    canvas.height = vid.videoHeight || 480;
    ctx.drawImage(vid, 0, 0);

    canvas.toBlob(function(blob) {
      if (!blob) return;

      var fd = new FormData();
      fd.append('image', blob, 'frame.jpg');

      fetch(getAPI() + '/detect', {
        method: 'POST',
        body: fd,
        signal: AbortSignal.timeout(3000)
      })
      .then(function(r) { if (r.ok) return r.json(); throw new Error(); })
      .then(function(result) { showResult(result); })
      .catch(function() { /* API not available, skip */ });

      webcamPollTimer = setTimeout(poll, 800);
    }, 'image/jpeg', 0.85);
  }
  poll();
}

function stopLive() {
  liveMode = false;

  if (liveStream) {
    liveStream.getTracks().forEach(function(t) { t.stop(); });
    liveStream = null;
  }
  if (ws) { ws.close(); ws = null; }
  if (webcamPollTimer) { clearTimeout(webcamPollTimer); webcamPollTimer = null; }

  document.getElementById('input-video').srcObject = null;
  document.getElementById('input-video').style.display = 'none';
  document.getElementById('input-img').style.display = 'none';
  document.getElementById('input-placeholder').style.display = 'block';

  document.getElementById('btn-live').textContent = 'Start Live';
  document.getElementById('btn-live').className = 'btn btn-live';
  setStatus('Idle');
}

// ─── WebSocket (for API live stats) ──────
function connectWS() {
  try {
    var wsUrl = getAPI().replace('http', 'ws');
    ws = new WebSocket(wsUrl + '/ws/live');
    ws.onmessage = function(evt) {
      var d = JSON.parse(evt.data);
      showResult({
        material: d.material,
        verdict: d.verdict,
        confidence: d.confidence,
        detections: (d.detections || []).map(function(x) {
          return { label: x.class || x.label, conf: x.conf };
        })
      });
    };
    ws.onerror = function() {};
    ws.onclose = function() { if (liveMode) setTimeout(connectWS, 2000); };
  } catch(e) {}
}

// ─── Show Input Image ────────────────────
function showInputImage(src) {
  document.getElementById('input-placeholder').style.display = 'none';
  document.getElementById('input-video').style.display = 'none';
  var img = document.getElementById('input-img');
  img.src = src;
  img.style.display = 'block';
}

// ─── Show Result ─────────────────────────
function showResult(r) {
  lastResult = r;
  var dets = r.detections || [];
  var mat = (r.material || '').toUpperCase();
  var severity = r.severity || '—';
  var bent = r.bent || '—';
  var defectType = r.defect_type || '—';

  // Hide idle message
  document.getElementById('idle-msg').style.display = 'none';

  // Fill info table
  document.getElementById('info-material').textContent = mat || '—';
  document.getElementById('info-defect-type').textContent = defectType;
  document.getElementById('info-severity').textContent = severity;
  document.getElementById('info-count').textContent = dets.length;
  document.getElementById('info-bent').textContent = bent;

  // Defect list
  if (dets.length > 0) {
    document.getElementById('defect-section').style.display = 'block';
    var html = '';
    for (var i = 0; i < dets.length; i++) {
      var conf = Math.round((dets[i].conf || 0) * 100);
      html += '<div class="defect-row">';
      html += '<span>' + (dets[i].label || 'Unknown') + '</span>';
      html += '<span class="defect-conf">' + conf + '%</span>';
      html += '</div>';
    }
    document.getElementById('defect-list').innerHTML = html;
  } else {
    document.getElementById('defect-section').style.display = 'none';
  }

  if (isManualMode) {
    // In manual mode: hide auto verdict, show pass/reject buttons
    document.getElementById('verdict-box').style.display = 'none';
    document.getElementById('manual-buttons').style.display = 'block';
  } else {
    // In auto mode: show ML verdict directly
    var isPass = (r.verdict || '').toUpperCase() === 'PASS';
    var isFail = (r.verdict || '').toUpperCase() === 'FAIL';
    document.getElementById('manual-buttons').style.display = 'none';
    var box = document.getElementById('verdict-box');
    box.style.display = 'block';
    box.className = 'result-box ' + (isPass ? 'pass' : isFail ? 'fail' : '');
    document.getElementById('verdict-label').textContent = isPass ? '✅ PASS' : isFail ? '❌ FAIL' : '—';
    document.getElementById('verdict-detail').textContent = isPass
      ? 'No defects detected'
      : isFail
      ? dets.length + ' defect' + (dets.length !== 1 ? 's' : '') + ' found'
      : '';
  }
}

// ─── Toggle Mode (Auto / Manual) ─────────
function toggleMode() {
  isManualMode = !isManualMode;
  var toggle = document.getElementById('mode-toggle');
  var labelAuto = document.getElementById('label-auto');
  var labelManual = document.getElementById('label-manual');

  if (isManualMode) {
    toggle.className = 'toggle-switch on';
    labelAuto.className = 'toggle-label';
    labelManual.className = 'toggle-label active';
  } else {
    toggle.className = 'toggle-switch';
    labelAuto.className = 'toggle-label active';
    labelManual.className = 'toggle-label';
  }

  // Update results display based on the new mode
  if (lastResult) {
    showResult(lastResult);
  } else {
    document.getElementById('verdict-box').style.display = 'none';
    document.getElementById('manual-buttons').style.display = 'none';
  }
}

// ─── Manual Decision ─────────────────────
function manualDecision(decision) {
  var box = document.getElementById('verdict-box');
  box.style.display = 'block';
  document.getElementById('manual-buttons').style.display = 'none';

  if (decision === 'PASS') {
    box.className = 'result-box pass';
    document.getElementById('verdict-label').textContent = '✅ PASS (Manual)';
    document.getElementById('verdict-detail').textContent = 'You approved this item';
  } else {
    box.className = 'result-box fail';
    document.getElementById('verdict-label').textContent = '❌ REJECTED (Manual)';
    document.getElementById('verdict-detail').textContent = 'You rejected this item';
  }
}

// ─── Status Bar ──────────────────────────
function setStatus(text) {
  document.getElementById('status-bar').textContent = text;
  document.getElementById('status-text').textContent = text;
}

// ─── Mock Result (when API is down) ──────
var STEEL_CLASSES = ['crazing', 'inclusion', 'patches', 'pitted_surface', 'rolled-in_scale', 'scratches'];
var WOOD_CLASSES = ['crack', 'knot', 'knot_with_crack', 'missing_knot', 'resin', 'blue_stain'];

function makeMockResult(filename) {
  var mat = (filename || '').toLowerCase().indexOf('wood') >= 0 ? 'wood' : 'steel';
  var classes = mat === 'steel' ? STEEL_CLASSES : WOOD_CLASSES;
  var hasDefect = Math.random() < 0.5;
  var dets = [];

  if (hasDefect) {
    var count = Math.floor(Math.random() * 3) + 1;
    for (var i = 0; i < count; i++) {
      dets.push({
        label: classes[Math.floor(Math.random() * classes.length)],
        conf: +(Math.random() * 0.45 + 0.52).toFixed(2)
      });
    }
  }

  return {
    material: mat,
    verdict: hasDefect ? 'FAIL' : 'PASS',
    confidence: hasDefect ? Math.max.apply(null, dets.map(function(d) { return d.conf; })) : Math.random() * 0.2,
    detections: dets
  };
}

// ─── Static demo result on page load ─────
var STATIC_RESULT = {
  material: 'steel',
  verdict: 'FAIL',
  defect_type: 'Surface Scratch',
  severity: 'Medium',
  bent: 'No',
  confidence: 0.87,
  detections: [
    { label: 'scratches', conf: 0.87 },
    { label: 'pitted_surface', conf: 0.72 },
    { label: 'inclusion', conf: 0.63 }
  ]
};

// Show static result on load (default to auto mode)
isManualMode = false;
document.getElementById('mode-toggle').className = 'toggle-switch';
document.getElementById('label-auto').className = 'toggle-label active';
document.getElementById('label-manual').className = 'toggle-label';
showResult(STATIC_RESULT);
</script>

</body>
</html>
